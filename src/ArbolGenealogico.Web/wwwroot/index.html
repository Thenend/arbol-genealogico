<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1016" />
    <title>Árbol Genealógico</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icono.png" />
    <link rel="apple-touch-icon" href="icono.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        // Enlaces directos (p. ej. …/arbol/<id>) en GitHub Pages: 404.html los manda aquí como ?ruta=… y se recuperan.
        (function () {
            var q = new URLSearchParams(location.search), r = q.get("ruta");
            if (r) { q.delete("ruta"); var s = q.toString(); history.replaceState(null, "", document.baseURI.replace(/\/$/, "/") + r.replace(/^\//, "") + (s ? "?" + s : "") + location.hash); }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="cargando">
            <img src="icono.png" alt="" width="72" height="72" />
            <div class="barra"><div></div></div>
            <p>Cargando el árbol genealógico…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo ha fallado. <a href="" class="reload">Volver a cargar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
