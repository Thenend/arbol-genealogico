<!doctype html>
<html><head><meta charset="utf-8">
<!-- Capturas de Google Play con titular: ?d=tel (1080 × 1920) o ?d=tab (1920 × 1080), ?n=1..6 y ?l=es|en|fr|it|de|pt.
     Las pantallas salen de crudas/<telefono|tablet>/<idioma>/. Se generan con: node tienda/promo/generar.js -->
<style>
@font-face{font-family:B;src:url(../../src/ArbolGenealogico.Movil/Recursos/Fuentes/BarlowSemiCondensed-Medium.ttf);font-weight:500}
@font-face{font-family:B;src:url(../../src/ArbolGenealogico.Movil/Recursos/Fuentes/BarlowSemiCondensed-SemiBold.ttf);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:B;font-weight:500;position:relative;overflow:hidden;color:#fff}
.abs{position:absolute}
h1{font-weight:600;line-height:1.02;letter-spacing:-.5px}
h1 em{font-style:normal;color:#F5C451}
.sub{color:#aab2c5;line-height:1.25}
.marco{position:absolute;background:#05060a;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px #3a4256 inset}
.marco>div{width:100%;height:100%;background-size:cover;background-position:center top}
</style></head>
<body>
<script>
const P = new URLSearchParams(location.search);
const D = P.get('d') || 'tel', N = +(P.get('n') || 1), L = P.get('l') || 'es';
const TEL = D === 'tel', W = TEL ? 1080 : 1920, H = TEL ? 1920 : 1080;
document.documentElement.style.cssText = document.body.style.cssText = `width:${W}px;height:${H}px`;

// [pantalla, titular (con *resaltado*), subtítulo]
const T = {
 es: [
  ['a-arbol','Tu árbol genealógico, *fácil de crear*','Toca a alguien y se ilumina su línea directa.'],
  ['b-familiar','Añade a tu familia *con un toque*','Padres, hermanos, parejas e hijos, cada uno en su sitio.'],
  ['c-compartir','Compártelo *como quieras*','En PDF, como imagen o con Ramo, que es gratis.'],
  ['d-imprimir','Listo para *imprimir*','En una o varias hojas, viendo antes cómo saldrá.'],
  ['e-fusion','Cada uno añade su rama y *se fusionan solos*','Sin duplicar a nadie.'],
  ['g-buscar','Encuentra a cualquiera y *su historia*','Fechas, lugares, fotos y lo que quieras contar.'],
 ],
 en: [
  ['a-arbol','Your family tree, *easy to build*','Tap someone and their direct line lights up.'],
  ['b-familiar','Add relatives *with one tap*','Parents, siblings, partners and children, each in place.'],
  ['c-compartir','Share it *your way*','As a PDF, an image, or with Ramo, which is free.'],
  ['d-imprimir','Ready to *print*','On one or more sheets, with a preview first.'],
  ['e-fusion','Everyone adds their branch and *trees merge*','Without duplicating anyone.'],
  ['g-buscar','Find anyone and *their story*','Dates, places, photos and anything you want to tell.'],
 ],
 fr: [
  ['a-arbol','Votre arbre généalogique, *facile à créer*','Touchez quelqu’un : sa lignée directe s’illumine.'],
  ['b-familiar','Ajoutez votre famille *d’une touche*','Parents, frères et sœurs, conjoints et enfants, à leur place.'],
  ['c-compartir','Partagez-le *comme vous voulez*','En PDF, en image ou avec Ramo, qui est gratuit.'],
  ['d-imprimir','Prêt à *imprimer*','Sur une ou plusieurs feuilles, avec un aperçu.'],
  ['e-fusion','Chacun complète sa branche et *tout fusionne*','Sans doublons.'],
  ['g-buscar','Retrouvez chacun et *son histoire*','Dates, lieux, photos et tout ce que vous voulez raconter.'],
 ],
 it: [
  ['a-arbol','Il tuo albero genealogico, *facile da creare*','Tocca qualcuno e si illumina la sua linea diretta.'],
  ['b-familiar','Aggiungi la famiglia *con un tocco*','Genitori, fratelli, coniugi e figli, ognuno al suo posto.'],
  ['c-compartir','Condividilo *come vuoi*','In PDF, come immagine o con Ramo, che è gratis.'],
  ['d-imprimir','Pronto da *stampare*','Su uno o più fogli, vedendo prima come verrà.'],
  ['e-fusion','Ognuno aggiunge il suo ramo e *si uniscono da soli*','Senza doppioni.'],
  ['g-buscar','Trova chiunque e *la sua storia*','Date, luoghi, foto e tutto ciò che vuoi raccontare.'],
 ],
 de: [
  ['a-arbol','Dein Stammbaum, *ganz einfach erstellt*','Tippe auf jemanden und seine direkte Linie leuchtet auf.'],
  ['b-familiar','Verwandte hinzufügen *mit einem Tipp*','Eltern, Geschwister, Partner und Kinder, alle am richtigen Platz.'],
  ['c-compartir','Teile ihn, *wie du willst*','Als PDF, als Bild oder mit Ramo, das kostenlos ist.'],
  ['d-imprimir','Bereit zum *Drucken*','Auf einem oder mehreren Blättern, mit Vorschau.'],
  ['e-fusion','Jeder ergänzt seinen Zweig, *alles wird zusammengeführt*','Ohne doppelte Einträge.'],
  ['g-buscar','Finde jeden und *seine Geschichte*','Daten, Orte, Fotos und alles, was du erzählen willst.'],
 ],
 pt: [
  ['a-arbol','Sua árvore genealógica, *fácil de criar*','Toque em alguém e a linha direta se ilumina.'],
  ['b-familiar','Adicione a família *com um toque*','Pais, irmãos, cônjuges e filhos, cada um no seu lugar.'],
  ['c-compartir','Compartilhe *do seu jeito*','Em PDF, como imagem ou com o Ramo, que é grátis.'],
  ['d-imprimir','Pronta para *imprimir*','Em uma ou várias folhas, vendo antes como vai ficar.'],
  ['e-fusion','Cada um completa seu ramo e *as árvores se juntam*','Sem duplicar ninguém.'],
  ['g-buscar','Encontre qualquer pessoa e *sua história*','Datas, lugares, fotos e tudo o que quiser contar.'],
 ],
};
const t = (T[L] || T.es)[N - 1];
const src = `crudas/${TEL ? 'telefono' : 'tablet'}/${L}/${t[0]}.png`;
const hl = s => s.replace(/\*(.+?)\*/g, '<em>$1</em>');

// fondo: el azul oscuro de la app con un brillo que cambia de sitio en cada captura, para que la tira no sea monótona
const gx = [20, 80, 30, 70, 25, 75][N - 1];
document.body.style.background = `radial-gradient(${W * 1.1}px ${H * 0.8}px at ${gx}% ${TEL ? 70 : 60}%, #26324d 0%, #131927 50%, #0a0c12 100%)`;

if (TEL) {
  // titular arriba y el teléfono abajo, cortado por el borde
  const fw = 780, fh = fw * 2;
  document.body.innerHTML = `
   <div class="abs" style="left:80px;right:80px;top:110px;text-align:center">
     <h1 id="h" style="font-size:96px">${hl(t[1])}</h1>
     <div class="sub" id="s" style="font-size:44px;margin-top:28px">${t[2]}</div></div>
   <div class="marco" id="m" style="left:${(W - fw) / 2}px;width:${fw}px;height:${fh}px;border-radius:84px;padding:22px">
     <div style="border-radius:64px;background-image:url(${src})"></div></div>`;
  document.getElementById('m').style.top = '520px';
} else {
  // titular arriba, en una línea, y la tableta entera debajo, cortada por el borde de abajo
  const fw = 1540, fh = fw * 9 / 16;
  document.body.innerHTML = `
   <div class="abs" style="left:120px;right:120px;top:64px;text-align:center">
     <h1 id="h" style="font-size:76px;white-space:nowrap">${hl(t[1])}</h1>
     <div class="sub" id="s" style="font-size:34px;margin-top:14px;white-space:nowrap">${t[2]}</div></div>
   <div class="marco" style="left:${(W - fw) / 2}px;top:280px;width:${fw}px;height:${fh}px;border-radius:52px;padding:22px">
     <div style="border-radius:32px;background-image:url(${src})"></div></div>`;
}
// si el titular no cabe en dos líneas (una en la tableta), se reduce la letra; el subtítulo, en una
const h = document.getElementById('h'), s = document.getElementById('s');
let fs = parseFloat(h.style.fontSize);
if (TEL) while (h.offsetHeight > fs * 1.02 * 2 + 4 && fs > 40) { fs -= 2; h.style.fontSize = fs + 'px'; }
else while (h.scrollWidth > h.clientWidth && fs > 40) { fs -= 1; h.style.fontSize = fs + 'px'; }
{ s.style.whiteSpace = 'nowrap'; let f2 = parseFloat(s.style.fontSize); while (s.scrollWidth > s.clientWidth && f2 > 24) { f2 -= 1; s.style.fontSize = f2 + 'px'; } }
</script>
</body></html>
